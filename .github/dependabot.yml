# Dependabot — tailored to the ecosystems actually present in this repo.
version: 2
updates:
  # GitHub Actions (all repos have workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci:"

# go
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "go"]
    commit-message:
      prefix: "deps(go):"

# docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps(docker):"

